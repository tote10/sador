services:
  - type: web
    name: sador
    runtime: docker
    plan: free
    healthCheckPath: /up
    envVars:
      - key: APP_NAME
        value: Sador General Construction
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        value: https://sador.onrender.com
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        fromDatabase:
          name: sador-db
          property: connectionString
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: FILESYSTEM_DISK
        value: local
      - key: LOG_CHANNEL
        value: stderr
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        value: Sador Admin
      - key: MAIL_MAILER
        value: smtp
      - key: MAIL_SCHEME
        value: tls
      - key: MAIL_HOST
        value: smtp.gmail.com
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_TIMEOUT
        value: "10"
      - key: MAIL_USERNAME
        value: "motialemu9@gmail.com"
      - key: MAIL_PASSWORD
        value: "iioyakqhwywxeodk"
      - key: MAIL_FROM_ADDRESS
        value: "motialemu9@gmail.com"
      - key: MAIL_FROM_NAME
        value: Sador General Construction

databases:
  - name: sador-db
    plan: free